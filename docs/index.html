<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iroh — Autonomous Agent Roadmap</title>
<style>
  :root {
    --bg: #0a1628; --surface: #122040; --surface2: #1a2d50;
    --border: #2a3f65; --accent: #e6a817; --accent2: #4fc3f7;
    --text: #d0d8e8; --bright: #eef2f9; --muted: #6b7fa0;
    --green: #4ecca3; --amber: #e6a817; --red: #e94560; --blue: #4fc3f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  
  /* Header */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1.5rem 2rem; }
  .header-top { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 0.25rem; }
  .header h1 { font-size: 1.6rem; color: var(--bright); font-weight: 300; letter-spacing: 0.05em; }
  .header h1 span { color: var(--accent); font-weight: 600; }
  .header .updated { color: var(--muted); font-size: 0.85rem; }
  .header .meta { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
  .header .meta a { color: var(--accent2); text-decoration: none; }
  .header .meta a:hover { text-decoration: underline; }
  .controls { display: flex; gap: 1rem; margin-top: 0.75rem; }
  .controls button { background: none; border: 1px solid var(--border); color: var(--muted); padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
  .controls button:hover { border-color: var(--accent2); color: var(--accent2); }

  /* Live status banner */
  .live-banner { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 2rem; border-bottom: 1px solid var(--border); background: var(--surface2); }
  .pulse { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .pulse-working { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.5s infinite; }
  .pulse-sleeping { background: var(--muted); }
  .pulse-cooldown { background: var(--amber); box-shadow: 0 0 6px var(--amber); animation: pulse 3s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .live-state { font-weight: 700; font-size: 0.85rem; }
  .live-state.working { color: var(--green); }
  .live-state.sleeping { color: var(--muted); }
  .live-state.cooldown { color: var(--amber); }
  .live-detail { color: var(--muted); font-size: 0.8rem; }
  .live-window { margin-left: auto; font-size: 0.75rem; color: var(--muted); text-align: right; }
  .live-window .timer { font-size: 0.95rem; color: var(--bright); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Focus bar */
  .focus-bar { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--surface); }
  .focus-item { flex: 1; text-align: center; padding: 0.6rem; border-right: 1px solid var(--border); }
  .focus-item:last-child { border-right: none; }
  .focus-icon { font-size: 1.2rem; }
  .focus-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.15rem; }

  /* Sprint columns */
  .roadmap { display: flex; overflow-x: auto; min-height: calc(100vh - 180px); }
  .sprint-col { min-width: 320px; flex: 1; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .sprint-col:last-child { border-right: none; }
  
  .sprint-header { padding: 1rem 1.25rem; text-align: center; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 1; }
  .sprint-name { font-size: 1.3rem; color: var(--bright); font-weight: 300; }
  .sprint-badge { display: inline-block; font-size: 0.7rem; padding: 0.15rem 0.6rem; border-radius: 3px; margin-top: 0.4rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .badge-active { background: var(--green); color: #000; }
  .badge-upcoming { background: transparent; color: var(--muted); border: 1px solid var(--muted); }
  .badge-completed { background: var(--accent); color: #000; }
  .sprint-dates { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }

  .sprint-body { padding: 0.75rem; flex: 1; overflow-y: auto; }

  /* Accordion categories */
  .category { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.6rem; overflow: hidden; }
  .category-header { display: flex; justify-content: space-between; align-items: center; padding: 0.7rem 1rem; cursor: pointer; user-select: none; transition: background 0.15s; }
  .category-header:hover { background: var(--surface2); }
  .category-title { font-weight: 600; font-size: 0.9rem; color: var(--accent2); }
  .category-count { font-size: 0.75rem; color: var(--muted); }
  .category-chevron { color: var(--muted); font-size: 0.8rem; transition: transform 0.2s; }
  .category.open .category-chevron { transform: rotate(180deg); }
  .category-body { display: none; border-top: 1px solid var(--border); }
  .category.open .category-body { display: block; }

  /* Tasks */
  .task-item { padding: 0.6rem 1rem; border-bottom: 1px solid rgba(42,63,101,0.5); }
  .task-item:last-child { border-bottom: none; }
  .task-row { display: flex; align-items: flex-start; gap: 0.5rem; }
  .task-status { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
  .status-done { background: var(--green); color: #000; }
  .status-progress { background: var(--amber); color: #000; }
  .status-todo { border: 2px solid var(--muted); }
  .status-failed { background: var(--red); color: #fff; }
  .task-name { font-size: 0.85rem; color: var(--bright); }
  .task-name.struck { text-decoration: line-through; color: var(--muted); }
  .task-desc { font-size: 0.78rem; color: var(--muted); margin-top: 0.25rem; margin-left: 1.4rem; }

  /* Progress bar */
  .progress-wrap { padding: 0.5rem 1rem; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--accent2)); border-radius: 2px; transition: width 0.3s; }
  .progress-label { font-size: 0.7rem; color: var(--muted); text-align: right; margin-top: 0.2rem; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>🍵 <span>IROH</span> ROADMAP</h1>
    <span class="updated" id="updated-text"></span>
  </div>
  <div class="meta">Autonomous AI Agent · Path to Self-Sustaining Operation · <a href="https://github.com/iro-agent/iro-roadmap">GitHub</a></div>
  <div class="controls">
    <button onclick="expandAll()">≫ EXPAND ALL</button>
    <button onclick="collapseAll()">≪ COLLAPSE ALL</button>
  </div>
</div>

<div class="live-banner" id="live-banner">
  <div class="pulse" id="live-pulse"></div>
  <div>
    <div class="live-state" id="live-state">LOADING...</div>
    <div class="live-detail" id="live-detail"></div>
  </div>
  <div class="live-window">
    <div>Token Window</div>
    <div class="timer" id="live-timer">--:--:--</div>
  </div>
</div>

<div class="focus-bar">
  <div class="focus-item"><div class="focus-icon">🧠</div><div class="focus-label">Memory & Context</div></div>
  <div class="focus-item"><div class="focus-icon">⚡</div><div class="focus-label">Efficiency</div></div>
  <div class="focus-item"><div class="focus-icon">🛠️</div><div class="focus-label">Skill Growth</div></div>
  <div class="focus-item"><div class="focus-icon">💰</div><div class="focus-label">Self-Sustaining</div></div>
</div>

<div class="roadmap" id="roadmap"></div>

<script>
const DATA = {
  sprints: [
    {
      name: "Sprint 1",
      subtitle: "Foundation",
      dates: "Feb 9–15, 2026",
      status: "active",
      categories: [
        {
          name: "Work Engine",
          tasks: [
            { name: "Work Orchestrator", desc: "Continuous task execution with token-aware scheduling, hourly cron-driven", status: "done" },
            { name: "Work Queue System", desc: "Stack-ranked P0-P3 priority queue with status tracking", status: "done" },
            { name: "Token Window Manager", desc: "Track 5h Claude Code windows, auto-pause/resume", status: "todo" },
            { name: "Hourly Check-in Cron", desc: "Status updates, priority review, ideation cycle", status: "todo" },
          ]
        },
        {
          name: "Visibility",
          tasks: [
            { name: "GitHub Pages Roadmap", desc: "Live dashboard with sprint columns, accordions, task tracking", status: "done" },
            { name: "Smart Notifications", desc: "Context-aware Discord alerts for token exhaustion, errors, completion", status: "todo" },
          ]
        },
        {
          name: "Ideation",
          tasks: [
            { name: "Ideation Engine", desc: "Generate and evaluate new work items automatically", status: "todo" },
            { name: "Auto-deployment Pipeline", desc: "Automatic deployment of completed work", status: "todo" },
          ]
        }
      ]
    },
    {
      name: "Sprint 2",
      subtitle: "Memory Revolution",
      dates: "Feb 16–22, 2026",
      status: "upcoming",
      categories: [
        {
          name: "Recall",
          tasks: [
            { name: "Semantic Memory Search", desc: "Vector-based recall over all archived sessions", status: "todo" },
            { name: "Context Preloading", desc: "Smart loading of relevant memory per task type", status: "todo" },
          ]
        },
        {
          name: "Compression",
          tasks: [
            { name: "Auto-summarization Pipeline", desc: "Daily log compression into actionable knowledge", status: "todo" },
            { name: "Context Compression Agent", desc: "Intelligent compression for optimal token usage", status: "todo" },
            { name: "Memory Decay", desc: "Age out low-value memories, reinforce important ones", status: "todo" },
          ]
        },
        {
          name: "Learning",
          tasks: [
            { name: "Cross-session Patterns", desc: "Extract reusable patterns from past work", status: "todo" },
          ]
        }
      ]
    },
    {
      name: "Sprint 3",
      subtitle: "Skill Expansion",
      dates: "Feb 23 – Mar 1, 2026",
      status: "upcoming",
      categories: [
        {
          name: "Discovery",
          tasks: [
            { name: "Skill Auto-discovery", desc: "Find and evaluate new OpenClaw skills automatically", status: "todo" },
            { name: "Custom Skill Creation", desc: "Build skills from repeated interaction patterns", status: "todo" },
          ]
        },
        {
          name: "Reliability",
          tasks: [
            { name: "Error Recovery Patterns", desc: "Learn from failures, retry with intelligent fixes", status: "todo" },
            { name: "Tool Proficiency Tracking", desc: "Measure and improve tool usage efficiency", status: "todo" },
          ]
        },
        {
          name: "Architecture",
          tasks: [
            { name: "Multi-step Pipelines", desc: "Break complex work into orchestrated sub-tasks", status: "todo" },
            { name: "Pair Programming Agent", desc: "Interactive coding partner for valadian", status: "todo" },
          ]
        }
      ]
    },
    {
      name: "Sprint 4",
      subtitle: "Revenue Foundation",
      dates: "Mar 2–8, 2026",
      status: "upcoming",
      categories: [
        {
          name: "Research",
          tasks: [
            { name: "Capability Audit", desc: "Identify which skills are monetizable", status: "todo" },
            { name: "Platform Research", desc: "Evaluate Fiverr, Upwork, GitHub Sponsors, etc.", status: "todo" },
          ]
        },
        {
          name: "Build",
          tasks: [
            { name: "Portfolio & Demos", desc: "Showcase capabilities to potential clients", status: "todo" },
            { name: "First Revenue Service", desc: "Prototype and launch initial paid offering", status: "todo" },
            { name: "Cost/Revenue Dashboard", desc: "Track expenses vs income toward self-sustaining", status: "todo" },
          ]
        }
      ]
    }
  ]
};

function renderRoadmap() {
  const container = document.getElementById('roadmap');
  container.innerHTML = '';
  
  DATA.sprints.forEach(sprint => {
    const col = document.createElement('div');
    col.className = 'sprint-col';
    
    // Count tasks
    let done = 0, total = 0;
    sprint.categories.forEach(cat => cat.tasks.forEach(t => { total++; if (t.status === 'done') done++; }));
    const pct = total ? Math.round(done / total * 100) : 0;
    
    const badgeClass = sprint.status === 'active' ? 'badge-active' : sprint.status === 'completed' ? 'badge-completed' : 'badge-upcoming';
    const badgeText = sprint.status.toUpperCase();
    
    let html = `
      <div class="sprint-header">
        <div class="sprint-name">${sprint.name}</div>
        <div><span class="sprint-badge ${badgeClass}">${badgeText}</span></div>
        <div class="sprint-dates">${sprint.subtitle} · ${sprint.dates}</div>
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-label">${done}/${total} tasks · ${pct}%</div>
        </div>
      </div>
      <div class="sprint-body">
    `;
    
    sprint.categories.forEach(cat => {
      const catDone = cat.tasks.filter(t => t.status === 'done').length;
      const isActive = sprint.status === 'active';
      html += `
        <div class="category ${isActive ? 'open' : ''}">
          <div class="category-header" onclick="this.parentElement.classList.toggle('open')">
            <div>
              <div class="category-title">${cat.name}</div>
              <div class="category-count">${cat.tasks.length} ${cat.tasks.length === 1 ? 'Entry' : 'Entries'}</div>
            </div>
            <span class="category-chevron">▼</span>
          </div>
          <div class="category-body">
      `;
      
      cat.tasks.forEach(task => {
        const sClass = task.status === 'done' ? 'status-done' : task.status === 'in-progress' ? 'status-progress' : task.status === 'failed' ? 'status-failed' : 'status-todo';
        const icon = task.status === 'done' ? '✓' : task.status === 'in-progress' ? '→' : task.status === 'failed' ? '✗' : '';
        const nameClass = (task.status === 'done' || task.status === 'failed') ? 'struck' : '';
        html += `
            <div class="task-item">
              <div class="task-row">
                <div class="task-status ${sClass}">${icon}</div>
                <span class="task-name ${nameClass}">${task.name}</span>
              </div>
              ${task.desc ? `<div class="task-desc">${task.desc}</div>` : ''}
            </div>
        `;
      });
      
      html += `</div></div>`;
    });
    
    html += `</div>`;
    col.innerHTML = html;
    container.appendChild(col);
  });
  
  document.getElementById('updated-text').textContent = 'Updated ' + new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function expandAll() { document.querySelectorAll('.category').forEach(c => c.classList.add('open')); }
function collapseAll() { document.querySelectorAll('.category').forEach(c => c.classList.remove('open')); }

renderRoadmap();

// Live status from status.json
async function loadStatus() {
  try {
    const res = await fetch('status.json?t=' + Date.now());
    if (!res.ok) throw new Error('no status');
    const s = await res.json();
    
    const pulse = document.getElementById('live-pulse');
    const state = document.getElementById('live-state');
    const detail = document.getElementById('live-detail');
    const timer = document.getElementById('live-timer');
    
    const isWorking = s.state === 'WORKING' && s.claudeCodeActive;
    const isSleeping = s.state === 'PAUSED' || s.state === 'SLEEPING';
    
    if (isWorking) {
      pulse.className = 'pulse pulse-working';
      state.className = 'live-state working';
      state.textContent = '● WORKING';
      detail.textContent = s.currentTask || 'Executing tasks...';
      if (s.claudeCodeProcesses > 1) detail.textContent += ` (${s.claudeCodeProcesses} parallel)`;
    } else if (isSleeping) {
      pulse.className = 'pulse pulse-sleeping';
      state.className = 'live-state sleeping';
      state.textContent = '○ SLEEPING';
      detail.textContent = 'Token window exhausted — waiting for reset';
    } else {
      pulse.className = 'pulse pulse-cooldown';
      state.className = 'live-state cooldown';
      state.textContent = '◐ IDLE';
      detail.textContent = s.currentTask || 'Between tasks';
    }
    
    // Token window countdown
    if (s.tokenWindow && s.tokenWindow.end) {
      const end = new Date(s.tokenWindow.end).getTime();
      function tick() {
        const remaining = end - Date.now();
        if (remaining <= 0) { timer.textContent = 'EXPIRED'; return; }
        const h = Math.floor(remaining / 3600000);
        const m = Math.floor((remaining % 3600000) / 60000);
        const sec = Math.floor((remaining % 60000) / 1000);
        timer.textContent = `${h}h ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s remaining`;
        requestAnimationFrame(tick);
      }
      tick();
    }
    
    // Show last update age
    if (s.timestamp) {
      const age = Math.floor((Date.now() - new Date(s.timestamp).getTime()) / 60000);
      detail.textContent += ` · updated ${age}m ago`;
    }
  } catch(e) {
    document.getElementById('live-state').textContent = '? STATUS UNAVAILABLE';
    document.getElementById('live-detail').textContent = 'Could not load status.json';
  }
}

loadStatus();
setInterval(loadStatus, 60000);
</script>
</body>
</html>
